name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Builds the server and the page, then the .exe and the release folder from them, so a
      # change that breaks packaging (or its third-party notices) fails here, not at release time.
      - name: Build and package
        run: npm run package

      - name: Manifest matches package.json
        run: node scripts/check-manifest.mjs
